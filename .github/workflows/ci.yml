name: CI

on:
  push:
    branches:
      - main
      - agents/hermes-lead
      - feature/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit (fail on high severity)
        run: npm audit --audit-level=high
      - name: Typecheck and build
        run: npm run build

  server:
    name: Application API, MCP and AI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The server package lives on feature/backend-mcp-ai. On branches without
      # it the job is skipped rather than failing the whole workflow. The
      # working directory is set per step, not job-wide, because the directory
      # does not exist on those branches.
      - name: Detect the server package
        id: detect
        run: |
          if [ -f server/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache npm
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-npm-${{ hashFiles('server/package-lock.json') }}

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (fail on high severity)
        if: steps.detect.outputs.present == 'true'
        working-directory: server
        run: npm audit --audit-level=high

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: server
        run: node --experimental-strip-types --test test/*.test.ts

  solana-program:
    name: Anchor program Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust source formatting
        run: cargo fmt --all -- --check
      - name: Compile program crate
        run: cargo check --manifest-path programs/rekey/Cargo.toml
      - name: Run policy unit tests
        run: cargo test --manifest-path programs/rekey/Cargo.toml
