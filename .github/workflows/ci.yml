name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit (fail on high severity)
        run: npm audit --audit-level=high
      - name: Typecheck and build
        run: npm run build

  solana-program:
    name: Anchor program Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust source formatting
        run: cargo fmt --all -- --check
      - name: Compile program crate
        run: cargo check --manifest-path programs/rekey/Cargo.toml
      - name: Run policy unit tests
        run: cargo test --manifest-path programs/rekey/Cargo.toml
