name: Build Program

# Builds the ReKey Anchor program to an SBF artifact and uploads it.
#
# Why this exists: the local macOS 11 host cannot SBF-build the program because the
# Solana platform-tools `rustc_driver` links against a libc++ typeinfo symbol
# (`__ZTTNSt3__118basic_stringstream...`) that macOS 11's `/usr/lib/libc++.1.dylib`
# does not export. This is a host-OS limitation, not a project defect, so the SBF
# build runs on Linux in CI instead. See docs/engineering-handoff.md blocker B1.

on:
  push:
    branches: [main, agents/hermes-lead, feature/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-program:
    name: SBF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + platform-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sbf-${{ runner.os }}-${{ hashFiles('programs/rekey/Cargo.toml', 'Cargo.toml') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked

      - name: Cache Anchor
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anchor
            ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Compile program crate
        run: cargo check --manifest-path programs/rekey/Cargo.toml

      - name: Run policy unit tests
        run: cargo test --manifest-path programs/rekey/Cargo.toml

      - name: Build SBF artifact
        run: |
          mkdir -p artifacts
          cargo build-sbf --manifest-path programs/rekey/Cargo.toml
          cp target/deploy/rekey_program.so artifacts/rekey_program.so
          ls -la artifacts/

      - name: Upload SBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekey-program-sbf
          path: artifacts/rekey_program.so
          retention-days: 30

      # Publish the binary to the public `ci-artifacts` branch so it can be fetched
      # over plain HTTPS without API auth. This is how the Devnet deployment step
      # obtains the program artifact.
      - name: Publish SBF artifact to a GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # A release asset is downloadable over plain HTTPS without API auth
          # (the release page is public for a public repo), which is how the
          # Devnet deployment step obtains the program artifact.
          TAG="sbf-latest"
          # Create or update the release.
          release_id=$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"ReKey SBF artifact (latest)\",\"body\":\"Automatically published by the Build Program workflow.\",\"prerelease\":true}")
          if [ "$release_id" = "201" ]; then
            id=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["id"])')
          else
            id=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          fi
          echo "RELEASE_ID=$id"
          # Upload the asset (delete any previous one first).
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}/assets" \
            | python3 -c 'import sys,json;[print(a["id"]) for a in json.load(sys.stdin)]' \
            | while read -r asset; do
              curl -sS -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
            done
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${GITHUB_WORKSPACE}/artifacts/rekey_program.so" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${id}/assets?name=rekey_program.so"
          echo
          sha256sum "$GITHUB_WORKSPACE/artifacts/rekey_program.so"
